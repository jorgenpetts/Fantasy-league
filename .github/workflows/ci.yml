name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: silent
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ci_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply migrations for integration tests
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_ORIGIN: http://localhost:4000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build

  prisma-migrations:
    name: Prisma Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_migrations?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_migrations?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ci_migrations
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Deploy migrations to empty PostgreSQL
        run: npx prisma migrate deploy

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag fantasy-cricket-backend:ci backend
      - name: Build frontend image
        run: >-
          docker build
          --file frontend/Dockerfile
          --build-arg BACKEND_ORIGIN=http://localhost:4000
          --tag fantasy-cricket-frontend:ci
          frontend
